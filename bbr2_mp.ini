; ---------------------------------------------------------------------------
; HOTKEYS
;   F6  open/close the overlay.
;   F9  HOST ONLY: call the race described above. Press it AT THE MAIN MENU.
;       Clients need do nothing at all - they are pulled in automatically.
;   F10 GO. Releases whichever gate is holding and tells every machine to do the
;       same in the same frame. F11 is a synonym.
;   F7  lobby status as a toast: how many players, how many ready.
;   F8  full status dump to bbr2_sdk.log - roster, phase, network diagnosis.
; ---------------------------------------------------------------------------

; --- added by the overlay ---
mirror = false
